# Netlify Configuration for Anudip Oil Mill

[build]
  publish = "."

# Automatically redirect root URL to html/home.html
[[redirects]]
  from = "/"
  to = "/html/home.html"
  status = 302
  force = true

[[redirects]]
  from = "/home"
  to = "/html/home.html"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/html/home.html"
  status = 302
  force = true

